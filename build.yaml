# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  # One dongle artifact per prospector status-screen layout.
  - board: xiao_ble//zmk
    shield: toucan_dongle rgbled_adapter prospector_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_PROSPECTOR_STATUS_SCREEN_CLASSIC=y
    artifact-name: toucan_dongle_classic
  - board: xiao_ble//zmk
    shield: toucan_dongle rgbled_adapter prospector_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_PROSPECTOR_STATUS_SCREEN_RADII=y
    artifact-name: toucan_dongle_radii
  - board: xiao_ble//zmk
    shield: toucan_dongle rgbled_adapter prospector_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_PROSPECTOR_STATUS_SCREEN_FIELD=y
    artifact-name: toucan_dongle_field
  - board: xiao_ble//zmk
    shield: toucan_dongle rgbled_adapter prospector_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y
    artifact-name: toucan_dongle_operator
  - board: xiao_ble//zmk
    shield: toucan_left rgbled_adapter toucan_pet
  - board: xiao_ble//zmk
    shield: toucan_right rgbled_adapter
  - board: xiao_ble//zmk
    shield: settings_reset
  - board: klink//zmk
    shield: toucan_tofu65
    artifact-name: toucan_tofu65
  - board: klink//zmk
    shield: settings_reset
    artifact-name: settings_reset_tofu65
