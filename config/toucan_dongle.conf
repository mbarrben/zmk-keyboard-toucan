# Prospector status screen (feat/new-status-screens branch)
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=15
CONFIG_PROSPECTOR_MODIFIER_ORDER="SCAG"

# LVGL draw buffers: prospector defaults to 50% of the 240x280 screen, double-buffered
# (2 x 67,200 B). 40% frees ~26 KB, needed since the 107-position Toucan + BT60 keymap
# pushed the radii layout past the nRF52840's 256 KB RAM.
CONFIG_LV_Z_VDB_SIZE=40
