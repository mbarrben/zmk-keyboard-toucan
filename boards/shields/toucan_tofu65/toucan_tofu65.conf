CONFIG_ZMK_BATTERY_REPORTING=y

# Same sleep policy as the Toucan halves: deep sleep after 1 h idle, any key wakes.
# The power switch sits under the Caps Lock keycap, so sleep is the normal "off".
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_IDLE_TIMEOUT=30000

# RGB indicator LED (gpio-leds in the klink board DTS), driven by tofu65_indicator.c.
CONFIG_LED=y
