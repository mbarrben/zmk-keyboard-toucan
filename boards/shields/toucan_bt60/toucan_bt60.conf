CONFIG_ZMK_BATTERY_REPORTING=y

# Same sleep policy as the Toucan halves.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Lighting can't be controlled from the dongle (no LED strip there, so &rgb_ug/&bl don't
# exist on the central). Keep the LEDs and their external power rail off on battery.
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n
CONFIG_ZMK_EXT_POWER=n
