CONFIG_ZMK_POINTING=y

# Toucan 2 trackpad: Azoteq TPS43 on i2c0 (see toucan_right.overlay).
CONFIG_I2C=y
CONFIG_INPUT_TPS43=y

CONFIG_ZMK_BATTERY_REPORTING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# Defaults to 15 minutes but 60 minutes is only very slightly more power draw and user experience is much better to not
# have keyboard go to deep sleep (i.e. having to reconenect to bluetooth)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# This is for 'regular' ZMK idle behavior.  Default is 30000 (30 seconds)
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Trackpad power saving is handled entirely by the TPS43 itself, via the
# enable-power-management and report-rate-lp2 properties on the devicetree node.
# The driver also sleeps the pad on ZMK's SLEEP activity state (tps43_idle_sleeper.c);
# doing the same on IDLE is opt-in via the `idle-sleep` property, which we leave off.
#
# Symmetric with the dongle: the central is the half that overflows because trackpad events fan out into the
# mouse HID path there, but bumping both sides keeps the per-side stack settings consistent and costs only ~1.5 KB
# of RAM on the peripheral, which has plenty of headroom.
CONFIG_INPUT_THREAD_STACK_SIZE=2048
